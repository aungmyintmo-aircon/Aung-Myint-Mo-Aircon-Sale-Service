<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Aung Myint Mo (Aircon Sale & Service) - Aircon အရောင်း၊ တပ်ဆင်၊ ပြုပြင်၊ Cleaning & Maintenance">

  <title>Aung Myint Mo | Aircon Sale & Service</title>

  <style>
    :root{
      --blue:#1769aa;
      --blue2:#0d47a1;
      --dark:#102a43;
      --light:#f4f9ff;
      --white:#ffffff;
      --green:#20a464;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:Arial,"Noto Sans Myanmar",sans-serif;
      color:var(--dark);
      background:var(--light);
      line-height:1.7;
    }

    a{
      text-decoration:none;
    }

    /* NAVIGATION */
    .nav{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,.96);
      box-shadow:0 3px 15px #00000015;
    }

    .navin{
      max-width:1150px;
      margin:auto;
      padding:10px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      color:var(--blue2);
      font-size:15px;
    }

    .brand img{
      width:55px;
      height:55px;
      object-fit:contain;
    }

    .links{
      display:flex;
      gap:22px;
      align-items:center;
    }

    .links a{
      color:var(--dark);
      font-weight:700;
    }

    .links a:hover{
      color:var(--blue);
    }

    /* HERO */
    .hero{
      background:
        radial-gradient(circle at top right,#dff2ff,transparent 35%),
        linear-gradient(135deg,#eaf6ff,#ffffff);
      padding:75px 18px 80px;
    }

    .hero-in{
      max-width:1150px;
      margin:auto;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      align-items:center;
      gap:45px;
    }

    .badge{
      display:inline-block;
      background:#d8edff;
      color:var(--blue2);
      padding:8px 15px;
      border-radius:999px;
      font-weight:800;
    }

    h1{
      font-size:clamp(38px,6vw,68px);
      line-height:1.05;
      margin:15px 0;
      color:var(--blue2);
    }

    .lead{
      font-size:20px;
      color:#40566f;
      max-width:650px;
    }

    .btns{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:28px;
    }

    .btn{
      display:inline-block;
      padding:13px 21px;
      border-radius:12px;
      font-weight:800;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .primary{
      background:var(--blue2);
      color:white;
    }

    .secondary{
      background:white;
      color:var(--blue2);
      border:2px solid var(--blue2);
    }

    .green{
      background:var(--green);
      color:white;
    }

    .hero-logo{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .hero-logo img{
      width:min(400px,90%);
      filter:drop-shadow(0 18px 25px #00000020);
    }

    /* SECTIONS */
    section{
      padding:70px 18px;
    }

    .wrap{
      max-width:1150px;
      margin:auto;
    }

    .center{
      text-align:center;
    }

    h2{
      font-size:34px;
      margin:0 0 10px;
      color:var(--blue2);
    }

    .muted{
      color:#61778f;
    }

    /* SERVICES */
    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-top:32px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:27px;
      box-shadow:0 7px 25px #173c6b12;
      border:1px solid #e3edf8;
      transition:.2s;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 12px 30px #173c6b20;
    }

    .icon{
      font-size:38px;
    }

    .card h3{
      margin:8px 0 5px;
      font-size:21px;
      color:var(--blue2);
    }

    .card p{
      margin-bottom:0;
      color:#526b84;
    }

    /* WHY US */
    .why{
      background:white;
    }

    .why-box{
      margin-top:30px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .why-item{
      text-align:center;
      padding:25px;
      border-radius:18px;
      background:#f3f8ff;
    }

    .why-item strong{
      display:block;
      font-size:19px;
      margin-top:8px;
      color:var(--blue2);
    }

    /* CONTACT */
    .contact{
      background:linear-gradient(135deg,var(--blue2),var(--blue));
      color:white;
    }

    .contact h2{
      color:white;
    }

    .contact .card{
      color:var(--dark);
    }

    .contact a{
      color:var(--blue2);
      font-weight:800;
    }

    .social{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:30px;
    }

    /* FOOTER */
    footer{
      background:#081b33;
      color:#d8e6f5;
      text-align:center;
      padding:30px 18px;
    }

    footer strong{
      font-size:17px;
    }

    /* MOBILE */
    @media(max-width:800px){

      .hero-in{
        grid-template-columns:1fr;
        text-align:center;
      }

      .lead{
        margin-left:auto;
        margin-right:auto;
      }

      .btns{
        justify-content:center;
      }

      .grid{
        grid-template-columns:1fr 1fr;
      }

      .why-box{
        grid-template-columns:1fr;
      }

      .links{
        display:none;
      }
    }

    @media(max-width:520px){

      .hero{
        padding:50px 18px 60px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      h2{
        font-size:28px;
      }

      .lead{
        font-size:18px;
      }

      .brand span{
        font-size:13px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="navin">

      <a class="brand" href="#home">
        <img src="logo.png" alt="Aung Myint Mo logo">
        <span>
          Aung Myint Mo<br>
          Aircon Sale & Service
        </span>
      </a>

      <div class="links">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </div>

    </div>
  </nav>


  <!-- HERO -->
  <main>

    <section class="hero" id="home">

      <div class="hero-in">

        <div>

          <span class="badge">
            ❄️ Aircon Sale & Service
          </span>

          <h1>
            Aung Myint Mo
          </h1>

          <p class="lead">
            အဲကွန်းအရောင်း၊ တပ်ဆင်၊ ပြုပြင်၊
            Cleaning & Maintenance ဝန်ဆောင်မှုများ
          </p>

          <div class="btns">

            <a class="btn primary"
               href="tel:+959266623535">
              📞 အခုဖုန်းဆက်ရန်
            </a>

            <a class="btn secondary"
               href="https://www.tiktok.com/@aung.myint.mo.air"
               target="_blank"
               rel="noopener">
              🎵 TikTok
            </a>

          </div>

        </div>
